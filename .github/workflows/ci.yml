name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dailyai
          POSTGRES_PASSWORD: dailyai
          POSTGRES_DB: dailyai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dailyai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dailyai:dailyai@localhost:5432/dailyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t daily-ai:ci .
